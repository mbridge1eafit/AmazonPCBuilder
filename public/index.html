<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Armador PC Colombia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='11' y='4' width='26' height='40' rx='4' fill='%23f97316'/%3E%3Ccircle cx='24' cy='20' r='6' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <strong>Armador PC</strong>
        <small>amazon.com → Colombia</small>
      </div>
    </div>
    <div class="builds">
      <label class="sr" for="buildSel">Armado</label>
      <select id="buildSel"></select>
      <button class="btn ghost" data-action="build-menu" aria-haspopup="menu" aria-label="Opciones del armado" title="Opciones del armado">⋯</button>
      <div class="menu" id="buildMenu" role="menu" hidden>
        <button data-action="build-new" role="menuitem">Nuevo armado</button>
        <button data-action="build-dup" role="menuitem">Duplicar armado</button>
        <button data-action="build-rename" role="menuitem">Renombrar</button>
        <button data-action="build-delete" role="menuitem" class="danger">Eliminar armado</button>
        <hr>
        <button data-action="export-md" role="menuitem">Copiar como Markdown</button>
        <button data-action="export-json" role="menuitem">Exportar JSON</button>
        <button data-action="import-json" role="menuitem">Importar JSON…</button>
        <hr>
        <button data-action="reset-seed" role="menuitem" class="danger">Restaurar datos de ejemplo</button>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn session off" id="sessionBtn" data-action="session">● Conectar Amazon</button>
      <button class="btn" data-action="connector">🔌 Conector</button>
      <button class="btn" data-action="refresh-all" id="refreshAll">↻ Actualizar todo</button>
      <button class="btn ghost" data-action="settings">⚙ Ajustes</button>
    </div>
  </header>

  <main class="layout">
    <aside class="side">
      <section class="card rig-card">
        <div id="rig"></div>
        <ul class="legend">
          <li><i class="dot buy"></i>Por comprar</li>
          <li><i class="dot bought"></i>Comprado</li>
          <li><i class="dot planned"></i>Planeado</li>
          <li><i class="dot empty"></i>Vacío</li>
          <li><i class="dot fixed"></i>★★★ fijo (decidido)</li>
        </ul>
      </section>
      <section class="card" id="summary"></section>
      <section class="card" id="checks"></section>
    </aside>
    <section class="parts" id="parts" aria-live="polite"></section>
  </main>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <input type="file" id="importFile" accept="application/json" hidden>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
